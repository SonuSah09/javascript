<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Async Functions Tuorial</h1>
    <button id="stop">Stop </button>
</body>
<script>
   
    setTimeout(function(){
        console.log("Sonu")
    }, 2000)

/* 
another way (by using refrence function)

const saySonu = function(){
        console.log("Sonu")
}
setTimeout(saySonu, 2000)

*/

// use of clearTimeout -- to stop setTimeout before execution
const changeText = function(){
document.querySelector('h1').innerHTML= 'My Javascript learning- Async'
}
const changeMe = setTimeout(changeText, 3000)
document.querySelector('#stop').addEventListener('click', function(){
    clearTimeout(changeMe)
    console.log("STOPPED")
})


</script>
</html>
